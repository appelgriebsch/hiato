name: generate-bun-lock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t1-scaffold-pwa
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Generate bun.lock
        run: bun install
      - name: Show lockfile stats
        run: |
          wc -c bun.lock
          sha256sum bun.lock
          head -c 200 bun.lock; echo
      - name: Commit bun.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --staged --quiet; then
            echo "No change to bun.lock"
            exit 0
          fi
          git commit -m "chore(t1): add bun.lock via bun@1.4.2 (Actions generate)"
          git push origin HEAD:t1-scaffold-pwa
