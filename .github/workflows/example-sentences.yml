name: Example sentences

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Languages to fill (pilot #247: en,de; widen #248: all)'
        required: true
        type: choice
        default: en,de
        options:
          - en,de
          - all
          - en
          - de
          - es
          - pt
          - fr
          - it
      levels:
        description: 'Comma-separated CEFR bands (pilot #247: a1,a2,b1; widen #248: a1,a2,b1,b2,c1,c2)'
        required: false
        type: string
        default: a1,a2,b1
      tatoeba:
        description: 'Use the Tatoeba dump as sentence source (falls back to Mistral-only examples when the download fails)'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Select Tatoeba sentences without calling Mistral or writing packs (no API key needed)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Regenerate examples even when the gate cache has a pass (--force)'
        required: false
        type: boolean
        default: false

concurrency:
  group: example-sentences
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      langs: ${{ steps.langs.outputs.langs }}
    steps:
      - name: Expand the lang input into a JSON array
        id: langs
        run: |
          set -euo pipefail
          case "${{ inputs.lang }}" in
            all) set -- en de es pt fr it ;;
            *) IFS=',' read -ra parts <<< "${{ inputs.lang }}"; set -- "${parts[@]}" ;;
          esac
          json=$(printf '"%s",' "$@")
          echo "langs=[${json%,}]" >> "$GITHUB_OUTPUT"
  examples:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lang: ${{ fromJSON(needs.plan.outputs.langs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/node-check.mjs --exact
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: scripts/data/tatoeba
          key: tatoeba-dump-${{ matrix.lang }}-v1
      - name: Run example-sentences
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EXAMPLE_LEVELS: ${{ inputs.levels }}
          EXAMPLE_TATOEBA: ${{ inputs.tatoeba }}
          EXAMPLE_DRY_RUN: ${{ inputs.dry_run }}
          EXAMPLE_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$EXAMPLE_DRY_RUN" != "true" ] && [ -z "${MISTRAL_API_KEY:-}" ]; then
            echo "::error::Set the MISTRAL_API_KEY repository secret (required unless dry_run is true)."
            exit 1
          fi
          args=(--levels="$EXAMPLE_LEVELS" --lang="${{ matrix.lang }}")
          if [ "$EXAMPLE_TATOEBA" = "false" ]; then args+=(--no-tatoeba); fi
          if [ "$EXAMPLE_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$EXAMPLE_FORCE" = "true" ]; then args+=(--force); fi
          bun run scripts/example-sentences.ts "${args[@]}"
      - name: Validate updated packs
        if: ${{ inputs.dry_run == false }}
        run: bun run packs:check
      - name: Commit updated packs to a branch and push
        if: ${{ inputs.dry_run == false }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="chore/example-sentences-${{ github.run_id }}-${{ matrix.lang }}"
          git checkout -b "$branch"
          git add "public/packs/${{ matrix.lang }}" scripts/data/example-gate.json scripts/data/pack-pin.json
          if git diff --cached --quiet; then
            echo "No pack changes — nothing to push."
            exit 0
          fi
          git commit -m "chore(packs): example sentences for ${{ matrix.lang }} ${{ inputs.levels }} (Example sentences run ${{ github.run_id }})

          Generated by the Example sentences workflow: $RUN_URL"
          git push -u origin "$branch"
          echo "Pushed $branch — open a PR from it to review the updated packs."
      - name: Upload updated packs and gate log
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-sentences-output-${{ matrix.lang }}
          path: |
            public/packs/${{ matrix.lang }}
            scripts/data/example-gate.json
            scripts/data/pack-pin.json
          if-no-files-found: ignore
      - name: Show resulting pack changes
        if: always()
        run: git diff --stat
