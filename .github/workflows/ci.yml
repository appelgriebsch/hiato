name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run packs:check
      - name: Hunspell verdict cache is committed
        run: |
          if ! git diff --exit-code -- scripts/data/hunspell-verdicts.json || [ -n "$(git status --porcelain -- scripts/data/hunspell-verdicts.json)" ]; then
            echo "hunspell-verdicts.json changed. Run bun run packs:check and commit scripts/data/hunspell-verdicts.json"
            git status --porcelain -- scripts/data/hunspell-verdicts.json
            exit 1
          fi
      - run: bun run build
      - run: bun test
      - name: Playwright landscape viewports
        run: bunx playwright install --with-deps chromium && bunx playwright test
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
