name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/node-check.mjs --exact
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Daily slots stay put
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          PACK_PIN_BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 --no-tags origin \
              "+refs/heads/${PACK_PIN_BASE}:refs/remotes/origin/${PACK_PIN_BASE}"
            PACK_PIN_BASE="origin/${PACK_PIN_BASE}" bun scripts/pack-pin.ts
          else
            git fetch --depth=1 --no-tags origin "$PACK_PIN_BASE"
            bun scripts/pack-pin.ts
          fi
      - run: bun run lint
      - run: bun run licenses:check
      - run: bun audit --prod --audit-level=high
      - name: actionlint and shellcheck
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP:-/tmp}/lint-tools"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o "$dir/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$dir/actionlint.tar.gz" | sha256sum -c
          printf '%s  %s\n' \
            '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' \
            "$dir/shellcheck.tar.xz" | sha256sum -c
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir" actionlint
          tar -xJf "$dir/shellcheck.tar.xz" -C "$dir" --strip-components=1 shellcheck-v0.11.0/shellcheck
          export PATH="$dir:$PATH"
          actionlint -shellcheck "$dir/shellcheck" .github/workflows/*.yml
          if compgen -G 'scripts/*.sh' > /dev/null; then
            shellcheck scripts/*.sh
          fi
      - run: bun run packs:check
      - name: Hunspell verdict cache is committed
        run: |
          if ! git diff --exit-code -- scripts/data/hunspell-verdicts.json || [ -n "$(git status --porcelain -- scripts/data/hunspell-verdicts.json)" ]; then
            echo "hunspell-verdicts.json changed. Run bun run packs:check and commit scripts/data/hunspell-verdicts.json"
            git status --porcelain -- scripts/data/hunspell-verdicts.json
            exit 1
          fi
      - run: bun run build
      - name: Pages functions build leaves package.json and bun.lock untouched
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js pages functions build --outdir "$RUNNER_TEMP/functions-build"
          if ! git diff --exit-code -- package.json bun.lock || [ -n "$(git status --porcelain -- package.json bun.lock)" ]; then
            echo "package.json or bun.lock changed."
            git status --porcelain -- package.json bun.lock
            exit 1
          fi
      - run: bun test
      - name: Playwright landscape viewports
        run: bunx playwright install --with-deps chromium && bunx playwright test
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
