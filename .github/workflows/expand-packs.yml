name: Expand packs

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language to expand (all = every supported language)'
        required: true
        type: choice
        default: all
        options:
          - all
          - en
          - de
          - es
          - pt
          - fr
          - it
      levels:
        description: 'Comma-separated CEFR bands (b2,c1,c2 for en/de/es/pt; a1-c2 for fr/it)'
        required: false
        type: string
        default: b2,c1,c2
      dry_run:
        description: 'Select lemmas without calling Mistral or writing packs (no API key needed)'
        required: false
        type: boolean
        default: false
      repair_gloss:
        description: 'Rewrite English-leaking glosses in shipped packs (--repair-gloss)'
        required: false
        type: boolean
        default: false
      force_gloss:
        description: 'Regenerate glosses even when cached (--force-gloss)'
        required: false
        type: boolean
        default: false

concurrency:
  group: expand-packs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/node-check.mjs --exact
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run expand-packs
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EXPAND_LANG: ${{ inputs.lang }}
          EXPAND_LEVELS: ${{ inputs.levels }}
          EXPAND_DRY_RUN: ${{ inputs.dry_run }}
          EXPAND_REPAIR_GLOSS: ${{ inputs.repair_gloss }}
          EXPAND_FORCE_GLOSS: ${{ inputs.force_gloss }}
        run: |
          set -euo pipefail
          if [ "$EXPAND_DRY_RUN" != "true" ] && [ -z "${MISTRAL_API_KEY:-}" ]; then
            echo "::error::Set the MISTRAL_API_KEY repository secret (required unless dry_run is true)."
            exit 1
          fi
          args=(--levels="$EXPAND_LEVELS")
          if [ "$EXPAND_LANG" != "all" ]; then args+=(--lang="$EXPAND_LANG"); fi
          if [ "$EXPAND_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$EXPAND_REPAIR_GLOSS" = "true" ]; then args+=(--repair-gloss); fi
          if [ "$EXPAND_FORCE_GLOSS" = "true" ]; then args+=(--force-gloss); fi
          bun run scripts/expand-packs.ts "${args[@]}"
      - name: Validate regenerated packs
        if: ${{ inputs.dry_run == false }}
        run: bun run packs:check
      - name: Upload regenerated packs and caches
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expand-packs-output
          path: |
            public/packs
            scripts/data/gloss-cache
            scripts/data/synonym-cache
          if-no-files-found: ignore
      - name: Show resulting pack changes
        if: always()
        run: git diff --stat
