# Pages Functions bindings (ADR 0021).
# Top-level [vars] apply to production. Pages preview deployments use [env.preview]
# (the only non-production Pages env) and set HIATO_STAGE to staging.
# Do not run `bunx wrangler` inside this checkout — it rewrites package.json and bun.lock.
name = "hiato"
compatibility_date = "2026-09-19"
pages_build_output_dir = "./dist"

[vars]
HIATO_STAGE = "production"

[env.preview.vars]
HIATO_STAGE = "staging"
