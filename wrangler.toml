# Pages Functions bindings (ADR 0021).
# Top-level [vars] apply to production. Preview must override them.
# Do not run `bunx wrangler` inside this checkout — it rewrites package.json and bun.lock.
name = "hiato"
compatibility_date = "2026-09-19"
pages_build_output_dir = "./dist"

[vars]
HIATO_STAGE = "production"

[env.preview.vars]
HIATO_STAGE = "preview"
