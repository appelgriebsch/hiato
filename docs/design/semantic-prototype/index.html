<script type="module">
/* Pixel icons: fetched from docs/design/retro/assets/icons and inlined so
 * currentColor / --icon-2 work exactly like src/components/PixelIcon.tsx. */
const iconCache = {}
async function icon(name, size = 16, cls = '', icon2) {
  if (!iconCache[name]) {
    const res = await fetch(`/docs/design/retro/assets/icons/${name}.svg`)
    const text = await res.text()
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml')
    iconCache[name] = doc.documentElement
  }
  const el = iconCache[name].cloneNode(true)
  el.setAttribute('width', size); el.setAttribute('height', size)
  if (cls) el.setAttribute('class', cls)
  if (icon2) el.style.setProperty('--icon-2', icon2)
  el.setAttribute('aria-hidden', 'true')
  return el
}
async function iconHTML(name, size = 16, cls = '', icon2) {
  return (await icon(name, size, cls, icon2)).outerHTML
}

/* Production-like data: public/packs/en/b1.json, seeded pilot word (ADR 0003 pattern). */
const LEMMA = {
  word: 'ABANDON',
  gloss: 'leave someone or something completely',
  synonyms: ['leave', 'desert'],
  example: "Don't abandon me!",
  pos: 'verb',
  ipa: '/əˈbæn.dən/',
  family: ['abandoned', 'abandonment', 'flee'],
}
const DATE_KEY = '2026-11-19'
const STREAK = 12, FREEZES = 1
const EN_ROWS = [['Q','W','E','R','T','Y','U','I','O','P'], ['A','S','D','F','G','H','J','K','L'], ['Z','X','C','V','B','N','M']]

/* Proximity stub for the prototype: per-Pack embeddings are the #306 research
 * spike (ADR 0026 budget). Values below are hand-picked for the demo round. */
const PROX = { LEAVE: 87, DESERT: 64, QUIT: 21, FORGET: 12 }
function proxOf(guess) {
  const g = guess.toUpperCase()
  if (g === LEMMA.word) return 100
  if (g in PROX) return PROX[g]
  let h = 0; for (const c of g) h = (h * 31 + c.charCodeAt(0)) % 997
  return 5 + (h % 35)
}
const proxTone = (p) => (p >= 80 ? 'hot' : p >= 50 ? 'warm' : 'cold')
const proxLabel = (p) => (p >= 80 ? 'Hot' : p >= 50 ? 'Warm' : 'Cold')

const $ = (sel, root = document) => root.querySelector(sel)
function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild }

async function topbar({ center }) {
  const el = h(`<div class="topbar">
    <div class="row gap-2">
      <span class="brand-mark" data-icon="mark" data-size="28" data-cls="text-accent" style="--icon-2:var(--color-raised)"></span>
      <span class="chip">Offline ready</span>
    </div>
    <div class="row gap-2">${center}</div>
    <span class="badge badge-raised px-frame" role="img" aria-label="Streak 12, 1 freeze">
      <span data-icon="flame" data-size="16" data-cls="text-coin" style="--icon-2:var(--color-danger)"></span>
      <span class="text-pixel-title">${STREAK}</span>
      <span data-icon="freeze" data-size="16" data-cls="text-ink-muted"></span>
      <span class="text-pixel-title">${FREEZES}</span>
    </span>
  </div>`)
  for (const s of el.querySelectorAll('[data-icon]')) {
    s.replaceWith(await icon(s.dataset.icon, +s.dataset.size || 16, s.dataset.cls || '', s.style.getPropertyValue('--icon-2') || undefined))
  }
  return el
}

function lives(remaining) {
  const el = h(`<div class="lives" role="status" aria-label="${remaining} lives remaining"></div>`)
  return (async () => {
    for (let i = 0; i < 6; i++) {
      el.appendChild(await icon(i < remaining ? 'seed' : 'seed-empty', 24, i < remaining ? 'text-accent-fg' : 'text-ink-muted'))
    }
    return el
  })()
}

function pad(used = []) {
  const wrap = h(`<div class="px-frame w-full min-w-0 pad-pad-wrap">
    <div data-letter-pad role="group" aria-label="Letter pad"></div>
  </div>`)
  const padEl = $('[data-letter-pad]', wrap)
  for (const row of EN_ROWS) {
    const r = h(`<div class="pad-row"></div>`)
    for (const k of row) {
      const usedCls = used.includes(k) ? 'style="opacity:.45"' : ''
      r.appendChild(h(`<button type="button" class="pad-key" ${usedCls}><span class="key-face">${k}</span></button>`))
    }
    padEl.appendChild(r)
  }
  const r = h(`<div class="pad-row"></div>`)
  r.appendChild(h(`<button type="button" class="pad-key wide"><span class="key-face text-ink-muted">⌫</span></button>`))
  r.appendChild(h(`<button type="button" class="pad-key wide"><span class="key-face bg-accent-soft text-accent-fg">ENTER</span></button>`))
  padEl.appendChild(r)
  return wrap
}

function clueCard() {
  return h(`<div class="card px-drop-card mb-4 overflow-hidden">
    <div class="px-stripe" aria-hidden="true"></div>
    <div class="p-5 text-center">
      <p class="text-caption mb-2 uppercase tracking-wide">Today's meaning · EN B1</p>
      <p lang="en" class="text-body text-ink" style="font-size:1.125rem">“${LEMMA.gloss}.”</p>
      <div class="row justify-center gap-2 mt-3">
        <span class="badge badge-neutral px-frame">${LEMMA.pos}</span>
        <span class="badge badge-neutral px-frame">6 lives</span>
        <span class="badge badge-neutral px-frame">No letters shown</span>
      </div>
    </div>
  </div>`)
}

function guessRow(guess) {
  const p = proxOf(guess), tone = proxTone(p)
  return h(`<div class="guess-row px-frame" style="--px-edge:var(--color-line)">
    <span class="guess-word text-ink">${guess.toUpperCase()}</span>
    <span class="prox-track"><span class="prox-bar prox-${tone}" style="width:${p}%"></span></span>
    <span class="prox-pct prox-${tone}">${p}% ${proxLabel(p)}</span>
  </div>`)
}

async function screenHome() {
  const shell = h(`<div data-layout-shell><div data-layout-scroll></div></div>`)
  const scroll = $('[data-layout-scroll]', shell)
  scroll.appendChild(await topbar({ center: '' }))
  scroll.appendChild(h(`<div class="card motion-enter mb-4 overflow-hidden">
    <div class="px-stripe" aria-hidden="true"></div>
    <div class="p-5">
      <h1 class="text-pixel-display mb-2 text-ink">Daily EN B1</h1>
      <p class="text-body mb-4 text-ink-muted">Guess today's word with six lives and learner hints. Offline after the pack is cached.</p>
      <a class="btn btn-primary px-frame px-drop motion-press w-full" href="?s=round">Play today <span aria-hidden="true">▸</span></a>
      <a class="btn btn-secondary w-full mt-2" href="?s=round">Practice</a>
    </div>
  </div>`))
  scroll.appendChild(h(`<div class="card px-drop-card overflow-hidden">
    <div class="px-stripe" aria-hidden="true"></div>
    <div class="p-5">
      <div class="row justify-between mb-2">
        <h1 class="text-pixel-display text-ink">Semantic Daily</h1>
        <span class="badge badge-accent px-frame">Pilot · #306</span>
      </div>
      <p class="text-body mb-1 text-ink-muted">Guess today's word <strong>by its meaning</strong> — no letters are shown, only how close each guess is. EN B1 pack, six lives, spoiler-free share card. Offline once the pack is cached.</p>
      <p class="text-caption mb-4">EN · B1 · seeded daily word · ${DATE_KEY}</p>
      <a class="btn btn-primary px-frame px-drop motion-press w-full" href="?s=round">Play semantic <span aria-hidden="true">▸</span></a>
      <div class="row justify-center mt-3"><span class="chip">Offline ready</span></div>
    </div>
  </div>`))
  scroll.appendChild(h(`<nav class="row justify-center gap-4 mt-4 text-sm">
    <a class="link" href="?s=home">Change language</a><span class="text-ink-faint">·</span><a class="link" href="?s=home">About</a>
  </nav>`))
  return shell
}

async function roundShell({ guesses = [] }) {
  const shell = h(`<div data-layout-shell><div data-layout-scroll class="cols"></div></div>`)
  const scroll = $('[data-layout-scroll]', shell)
  scroll.appendChild(await topbar({ center: '<span class="badge badge-accent px-frame">Semantic</span>' }))
  const col = h(`<div class="sl-col"></div>`)
  const livesRow = h(`<div class="mb-3 row justify-between"></div>`)
  livesRow.appendChild(await lives(6 - guesses.length))
  livesRow.appendChild(h(`<span class="text-pixel-label" style="letter-spacing:.08em">EN · B1</span>`))
  col.appendChild(livesRow)
  col.appendChild(clueCard())
  if (guesses.length === 0) {
    col.appendChild(h(`<div class="px-frame mb-3 w-full" style="--px-edge:var(--color-line)">
      <input class="guess-field" placeholder="Type your guess…" aria-label="Type your guess" />
    </div>`))
    col.appendChild(h(`<p class="text-caption mb-4 text-center">Meaning only — the word and its letters stay hidden until the round ends. Each wrong guess costs one life.</p>`))
  } else {
    const list = h(`<div class="flex-col gap-2 mb-4"></div>`)
    for (const g of guesses) list.appendChild(guessRow(g))
    col.appendChild(list)
    col.appendChild(h(`<p class="text-caption mb-3 text-center" role="status">${proxLabel(proxOf(guesses[guesses.length-1]))} — keep guessing. ${6 - guesses.length} ${6 - guesses.length === 1 ? 'life' : 'lives'} left.</p>`))
  }
  col.appendChild(h(`<div class="row justify-center gap-4 pt-2 text-sm" data-round-nav>
    <a class="link link-muted" href="?s=home">← Home</a>
    <a class="link" href="?s=endcard">Practice</a>
  </div>`))
  scroll.appendChild(col)
  const aside = h(`<div class="sl-aside w-full"></div>`)
  aside.appendChild(pad())
  scroll.appendChild(aside)
  // portrait: pad pinned at the bottom
  const footer = h(`<div style="margin-top:auto;padding-top:.5rem"></div>`)
  footer.appendChild(pad())
  shell.appendChild(footer)
  shell.querySelector('.sl-aside').classList.add('sl-pad-aside')
  return shell
}

async function screenRound(s) {
  const guesses = s === 'progress' ? ['leave', 'desert', 'quit'] : []
  return roundShell({ guesses })
}

async function screenEndcard() {
  const shell = h(`<div data-layout-shell><div data-layout-scroll class="cols"></div></div>`)
  const scroll = $('[data-layout-scroll]', shell)
  scroll.appendChild(await topbar({ center: '<span class="badge badge-accent px-frame">Semantic</span>' }))
  const col = h(`<div class="sl-col" style="position:relative"></div>`)
  const sparks = h(`<div aria-hidden="true"></div>`)
  for (const [x, y] of [[8, 6], [88, 4], [80, 14], [16, 16]]) {
    const s = h(`<span class="px-spark" style="left:${x}%;top:${y}%"></span>`)
    s.appendChild(await icon('spark', 24, 'text-spark', 'var(--color-coin)'))
    sparks.appendChild(s)
  }
  col.appendChild(sparks)
  const head = h(`<div class="px-frame bg-raised/80 px-4 py-2 text-center my-3" style="background:color-mix(in srgb,var(--color-raised) 80%,transparent)">
    <span class="badge badge-accent px-frame" data-endcard-badge>Solved · 4 guesses</span>
    <p class="mt-2"><span lang="en" class="text-pixel-label text-accent-fg">ABANDON</span></p>
    <p lang="en" class="text-body text-ink-muted mt-1">“${LEMMA.gloss}.”</p>
  </div>`)
  col.appendChild(head)
  const extras = h(`<div class="card px-flat w-full p-4 text-left mb-3" style="--px-edge:var(--color-line)">
    <p class="text-caption uppercase tracking-wide mb-2">Word</p>
    <p class="text-pixel-display text-ink" lang="en">ABANDON</p>
    <p lang="en" class="text-sm text-ink-muted mt-1">${LEMMA.pos} · ${LEMMA.ipa}</p>
    <div class="row flex-wrap gap-2 mt-3">${LEMMA.synonyms.map(s => `<span class="chip-syn" lang="en">${s}</span>`).join('')}</div>
    <p lang="en" class="text-body mt-3" style="font-style:italic">“${LEMMA.example}”</p>
    <div class="row flex-wrap gap-2 mt-3">${LEMMA.family.map(f => `<span class="chip" lang="en">${f}</span>`).join('')}</div>
  </div>`)
  col.appendChild(extras)
  const prox = h(`<div class="card px-flat w-full p-4 mb-4" style="--px-edge:var(--color-line)">
    <p class="text-caption uppercase tracking-wide mb-2">Your guesses</p>
    <div class="flex-col gap-2"></div>
  </div>`)
  for (const g of ['leave', 'desert', 'quit', 'abandon']) $('div', prox).appendChild(guessRow(g))
  col.appendChild(prox)
  col.appendChild(h(`<a class="btn btn-primary px-frame px-drop motion-press w-full" href="?s=share">Share spoiler-free card</a>`))
  col.appendChild(h(`<a class="btn btn-secondary w-full mt-2" href="?s=round">Practice</a>`))
  col.appendChild(h(`<div class="row justify-center gap-4 pt-6 text-sm" data-round-nav><a class="link link-muted" href="?s=home">← Home</a></div>`))
  scroll.appendChild(col)
  return shell
}

async function screenShare() {
  const shell = h(`<div data-layout-shell style="align-items:center;justify-content:center"><div data-layout-scroll style="justify-content:center;width:100%"></div></div>`)
  const scroll = $('[data-layout-scroll]', shell)
  const card = h(`<div class="share-card px-frame px-drop-card" id="hiato-share-card">
    <div class="px-stripe" aria-hidden="true"></div>
    <div class="p-5 pt-6 pb-2 text-center">
      <div class="row justify-center mb-2"><span data-icon="mark" data-size="32" data-cls="text-accent" style="--icon-2:var(--color-raised)"></span></div>
      <div class="text-pixel-display text-accent-fg">Hiato</div>
      <p class="text-sm text-ink-muted mt-1">Semantic Daily · solved in 4 guesses</p>
    </div>
    <div class="share-stats px-frame">
      <div><div class="share-label">Language</div><div class="text-pixel-value text-ink">EN · English</div></div>
      <div><div class="share-label">Level</div><div class="text-pixel-value text-ink">B1</div></div>
      <div><div class="share-label">Streak</div><div class="text-pixel-value text-ink row gap-1"><span data-icon="flame" data-size="18" data-cls="text-coin" style="--icon-2:var(--color-danger)"></span>${STREAK}</div></div>
      <div><div class="share-label">Date</div><div class="text-pixel-value text-ink">${DATE_KEY}</div></div>
    </div>
    <div class="row flex-wrap justify-center gap-2 px-6" aria-hidden="true">
      ${[87, 64, 21, 100].map(p => `<span class="prox-sq px-frame" style="--px-edge:var(--color-line);background:${p >= 80 ? 'var(--color-accent-soft)' : p >= 50 ? 'color-mix(in srgb,var(--color-coin) 30%,var(--color-raised))' : 'var(--color-cream-dark)'}"></span>`).join('')}
    </div>
    <p class="text-caption text-center mt-2 mb-1">Closeness per guess — the answer is never on the card.</p>
    <div class="row justify-center px-6 pb-2 mt-2">
      <span class="badge badge-accent px-frame"><span data-icon="check" data-size="14" class="text-accent-fg"></span> Solved · 4 guesses</span>
    </div>
    <p class="text-caption text-center" style="padding:0 1.5rem 1.25rem">hiato.app</p>
  </div>`)
  for (const s of card.querySelectorAll('[data-icon]')) {
    s.replaceWith(await icon(s.dataset.icon, +s.dataset.size || 16, s.dataset.cls || '', s.style.getPropertyValue('--icon-2') || undefined))
  }
  scroll.appendChild(card)
  return shell
}

const screens = { home: screenHome, round: () => screenRound('round'), progress: () => screenRound('progress'), endcard: screenEndcard, share: screenShare }
const s = new URLSearchParams(location.search).get('s') || 'home'
const app = $('#app')
app.appendChild(await screens[s]())
document.title = `Hiato — Semantic prototype (${s})`
</script>
</body>
</html>
